# 推送 v* 标签时自动构建 macOS（universal）和 Windows（.msi / .exe），生成草稿 Release。
#   git tag v0.4.1 && git push origin v0.4.1
# macOS 只做 ad-hoc 签名（tauri.conf.json 的 signingIdentity "-"），没有 Developer ID 签名和公证；打开方法见 README「安装」一节。
# 自动更新：用仓库 Secrets 里的 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD 给更新包签名，
# tauri-action 生成 latest.json（含各平台下载地址和签名）一起上传到 Release。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "奥半仙 Ao Banxian ${{ github.ref_name }}"
          releaseBody: |
            像素道士黄历桌面小组件。下载对应平台的安装包：
            - macOS：`AoBanxian_*_universal.dmg`（Intel 和 Apple 芯片通用）
            - Windows：`AoBanxian_*_x64-setup.exe`（推荐）或 `AoBanxian_*_x64.msi`

            macOS 版还没有做 Apple 签名，第一次打开的方法见 README「安装」一节。完整说明发布时补上。
          # GitHub 会去掉附件名里的中文（产品名「奥半仙」），所以附件名用拼音
          assetNamePattern: "AoBanxian_[version]_[arch][setup][ext]"
          releaseDraft: true
          # 自动更新：生成并上传 latest.json；Windows 用 NSIS 安装包更新
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          prerelease: false
          args: ${{ matrix.args }}
